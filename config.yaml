data_dir: data/Selected_database
output_dir: results

selection:
  candidate_pool_size: 15
  n_cases: 1
  slices_per_case: 5
  slice_strategy: stratified
  minimum_slice_gap_mm: 10
  min_tumor_pixels: 20
  # Legacy index spacing used only by slice_strategy: area_top.
  minimum_slice_gap: 2
  seed: 2026

dataset_context:
  density_tolerance_hu: 5

features:
  glcm_levels: 16

lesion_eval:
  min_iou: 0.0

morphology3d_prediction:
  min_component_voxels: 8

compression:
  qualities: [95, 75, 50, 25, 10]

reconstruction:
  angles: [180, 60, 20]
  downsample: 1
  cases: 3
  slices_per_case: 3
  sart_iterations: 3
  sart_relaxation: 0.15
  margin: 8

preprocessing:
  hu_window:
    center: 30
    width: 150
  denoising:
    method: gaussian
    gaussian_sigma: 0.3
    mean_size: 3
  enhancement:
    method: clahe
    clahe_clip_limit: 0.01
    clahe_kernel_size: 8
  crop_margin: 8

edge_analysis:
  operator: sobel
  sharpen_alpha: 0.5

segmentation:
  method: global
  threshold: 0.45
  k: 1.0
  direction: lower
  opening: false
  closing: false
  fill_holes: false
  footprint: disk
  radius: 1
  min_area: 0
