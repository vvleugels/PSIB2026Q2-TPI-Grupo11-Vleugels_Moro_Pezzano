compression:
  qualities:
  - 95
  - 75
  - 50
  - 25
  - 10
data_dir: data/Task03_Liver
dataset_context:
  density_tolerance_hu: 5
detection:
  background_sigma_mm: 10.0
  enabled: false
  high: 1.0
  low: 0.33
  method: hysteresis
  min_area_mm2: 1.0
  noise_floor_hu: 5.0
  sigma_mm: 0.6
edge_analysis:
  operator: none
  sharpen_alpha: 0.5
features:
  glcm_levels: 16
lesion_eval:
  min_iou: 0.0
morphology3d_prediction:
  min_component_voxels: 8
output_dir: results
preprocessing:
  crop_margin: 8
  denoising:
    gaussian_sigma: 1.0
    method: gaussian
  enhancement:
    clahe_clip_limit: 0.1
    clahe_kernel_size: 5
    contrast: 1.0
    method: none
  hu_window:
    center: 30.0
    enabled: true
    width: 150.0
reconstruction:
  angles:
  - 180
  - 60
  - 20
  cases: 3
  downsample: 1
  margin: 8
  sart_iterations: 3
  sart_relaxation: 0.15
  slices_per_case: 3
segmentation:
  method: otsu
  threshold: 0.45
  k: 1.0
  direction: lower
  opening: true
  closing: true
  fill_holes: true
  footprint: disk
  radius: 2
  min_area: 50
selection:
  candidate_pool_size: 15
  min_tumor_pixels: 20
  minimum_slice_gap: 2
  minimum_slice_gap_mm: 10
  n_cases: 131
  seed: 2026
  slice_strategy: stratified
  slices_per_case: 5
preprocessing_scope: liver
local_pipeline: configured
